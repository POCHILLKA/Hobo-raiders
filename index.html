<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hobo Raiders</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #030407; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; overflow: hidden; padding: 4px; color: #e2e8f0; }

    #hud { width: 100%; max-width: 360px; display: flex; justify-content: space-between; font-size: 9px; font-weight: bold; padding: 6px; background: #111827; border-radius: 6px; border: 1px solid #38bdf8; }
    .gold { color: #facc15; }
    .hp { color: #ef4444; }

    #game-container { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid #38bdf8; background: #07090f; }
    canvas { width: 100%; height: 100%; display: block; }

    .overlay { display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 12, 0.96); flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; z-index: 20; gap: 10px; }
    .overlay h2 { color: #38bdf8; font-size: 13px; margin-bottom: 4px; text-shadow: 0 0 8px #38bdf8; }

    .btn { background: #38bdf8; border: none; padding: 10px 16px; color: #08090d; font-weight: bold; border-radius: 6px; font-size: 11px; cursor: pointer; width: 100%; max-width: 200px; }
    .btn:active { transform: scale(0.97); }

    .map-list { width: 100%; display: flex; flex-direction: column; gap: 4px; margin: 6px 0; max-height: 110px; overflow-y: auto; }
    .map-card { background: #111827; padding: 6px; border-radius: 4px; font-size: 9px; border: 1px solid #1f293d; text-align: left; cursor: pointer; }
    .map-card.selected { border-color: #38bdf8; background: #16243b; }

    #controls { width: 100%; max-width: 360px; height: 130px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #0b0f17; border-radius: 16px; border: 1px solid #1e293b; }
    #stick-base { width: 95px; height: 95px; background: #131b26; border-radius: 50%; border: 2px solid #38bdf8; position: relative; display: flex; align-items: center; justify-content: center; }
    #stick-knob { width: 38px; height: 38px; background: #38bdf8; border-radius: 50%; position: absolute; pointer-events: none; }
    
    .fire-btn { width: 65px; height: 65px; background: #ef4444; border-radius: 50%; border: 3px solid #b91c1c; color: white; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 10px rgba(239,68,68,0.4); }
    .fire-btn:active { background: #991b1b; }
  </style>
</head>
<body>

  <div id="hud">
    <span>БАЛАНС: <b id="hud-stash" class="gold">0</b> дет.</span>
    <span>ХАБАР: <b id="hud-loot" class="gold">+0</b></span>
    <span>HP: <b id="hud-hp" class="hp">100</b></span>
  </div>

  <div id="game-container">
    <canvas id="game" width="320" height="320"></canvas>

    <!-- МЕНЮ БУНКЕРА -->
    <div id="bunker-overlay" class="overlay">
      <h2>СХРОН И ВЫБОР СЕКТОРА</h2>
      <div style="font-size: 9px; color: #94a3b8;">Баланс деталей: <span id="menu-stash" class="gold">0</span></div>
      
      <div class="map-list" id="map-list">
        <div class="map-card selected" onclick="selectMap(0)">Кошачий лоток (Обычный)</div>
        <div class="map-card" onclick="selectMap(1)">Жёлтый снег (Орда роботов)</div>
      </div>

      <button class="btn" onclick="startRaid()">В РЕЙД</button>
    </div>

    <!-- МЕНЮ ИТОГОВ РЕЙДА -->
    <div id="summary-overlay" class="overlay" style="display:none;">
      <h2 style="color: #4ade80;" id="sum-title">ЭВАКУАЦИЯ УСПЕШНА!</h2>
      <div style="font-size: 9px; margin-bottom: 6px;">Вынесено хабара: <span id="sum-loot" class="gold">+0</span> деталей</div>
      <button class="btn" onclick="returnToBunker()">В БУНКЕР</button>
    </div>
  </div>

  <div id="controls">
    <div id="stick-base">
      <div id="stick-knob"></div>
    </div>
    <div class="fire-btn" onclick="playerShoot()">ОГОНЬ</div>
  </div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let stash = parseInt(localStorage.getItem("hobo_stash") || "0", 10);
let gameState = "bunker"; // bunker, playing, summary
let selectedMap = 0;

let player = { x: 160, y: 160, w: 16, h: 16, speed: 2.2, hp: 100, loot: 0, dirX: 0, dirY: -1 };
let enemies = [];
let bullets = [];
let moveVec = { x: 0, y: 0 };

function updateHUD() {
  document.getElementById("hud-stash").innerText = stash;
  document.getElementById("menu-stash").innerText = stash;
  document.getElementById("hud-loot").innerText = `+${player.loot}`;
  document.getElementById("hud-hp").innerText = player.hp;
}

function selectMap(idx) {
  selectedMap = idx;
  let cards = document.querySelectorAll('.map-card');
  cards.forEach((c, i) => {
    if (i === idx) c.classList.add('selected');
    else c.classList.remove('selected');
  });
}

function startRaid() {
  document.getElementById("bunker-overlay").style.display = "none";
  player.x = 160; player.y = 160; player.hp = 100; player.loot = 0;
  
  // Спавним врагов в зависимости от карты
  enemies = [];
  let count = selectedMap === 1 ? 5 : 2;
  for (let i = 0; i < count; i++) {
    enemies.push({
      x: 60 + Math.random() * 200,
      y: 60 + Math.random() * 200,
      w: 16, h: 16, hp: 40, speed: 0.8
    });
  }
  bullets = [];
  gameState = "playing";
}

function playerShoot() {
  if (gameState !== "playing") return;
  bullets.push({
    x: player.x + 6, y: player.y + 6,
    dx: player.dirX * 4, dy: player.dirY * 4,
    w: 4, h: 4
  });
}

function returnToBunker() {
  stash += player.loot;
  localStorage.setItem("hobo_stash", stash);
  document.getElementById("summary-overlay").style.display = "none";
  document.getElementById("bunker-overlay").style.display = "flex";
  gameState = "bunker";
  updateHUD();
}

function update() {
  if (gameState !== "playing") return;

  if (moveVec.x !== 0 || moveVec.y !== 0) {
    player.dirX = moveVec.x;
    player.dirY = moveVec.y;
  }

  player.x = Math.max(10, Math.min(300, player.x + moveVec.x * player.speed));
  player.y = Math.max(10, Math.min(300, player.y + moveVec.y * player.speed));

  // Движение пуль
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.dx; b.y += b.dy;
    if (b.x < 0 || b.x > 320 || b.y < 0 || b.y > 320) {
      bullets.splice(i, 1);
      continue;
    }

    // Попадания по врагам
    for (let j = enemies.length - 1; j >= 0; j--) {
      let en = enemies[j];
      if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
        en.hp -= 20;
        bullets.splice(i, 1);
        if (en.hp <= 0) {
          enemies.splice(j, 1);
          player.loot += 10; // Награда за робота
        }
        break;
      }
    }
  }

  // Интеллект врагов (идут за игроком)
  for (let en of enemies) {
    let dx = player.x - en.x;
    let dy = player.y - en.y;
    let dist = Math.hypot(dx, dy);
    if (dist > 1) {
      en.x += (dx / dist) * en.speed;
      en.y += (dy / dist) * en.speed;
    }
    // Урон игроку при столкновении
    if (Math.hypot(player.x - en.x, player.y - en.y) < 12) {
      player.hp = Math.max(0, player.hp - 0.5);
      if (player.hp <= 0) {
        gameState = "summary";
        document.getElementById("sum-title").innerText = "ПОГИБ В РЕЙДЕ!";
        document.getElementById("sum-title").style.color = "#ef4444";
        document.getElementById("sum-loot").innerText = "0 (утеряно)";
        player.loot = 0;
        document.getElementById("summary-overlay").style.display = "flex";
      }
    }
  }

  // Победа (все враги убиты)
  if (enemies.length === 0 && gameState === "playing") {
    gameState = "summary";
    document.getElementById("sum-title").innerText = "ЭВАКУАЦИЯ УСПЕШНА!";
    document.getElementById("sum-title").style.color = "#4ade80";
    document.getElementById("sum-loot").innerText = `+${player.loot}`;
    document.getElementById("summary-overlay").style.display = "flex";
  }

  updateHUD();
}

function draw() {
  ctx.fillStyle = "#07090f";
  ctx.fillRect(0, 0, 320, 320);

  if (gameState === "playing") {
    // Зона эвакуации
    ctx.fillStyle = "rgba(56, 189, 248, 0.2)";
    ctx.fillRect(10, 10, 40, 40);
    ctx.strokeStyle = "#38bdf8";
    ctx.strokeRect(10, 10, 40, 40);

    // Игрок
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Враги
    ctx.fillStyle = "#ef4444";
    for (let en of enemies) {
      ctx.fillRect(en.x, en.y, en.w, en.h);
    }

    // Пули
    ctx.fillStyle = "#facc15";
    for (let b of bullets) {
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Сенсорный джойстик
const base = document.getElementById("stick-base");
const knob = document.getElementById("stick-knob");
let active = false;
let center = { x: 0, y: 0 };
const maxRad = 32;

base.addEventListener("touchstart", (e) => {
  e.preventDefault();
  active = true;
  let r = base.getBoundingClientRect();
  center = { x: r.left + r.width/2, y: r.top + r.height/2 };
  handleTouch(e.touches[0].clientX, e.touches[0].clientY);
});

window.addEventListener("touchmove", (e) => {
  if (!active) return;
  e.preventDefault();
  handleTouch(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

window.addEventListener("touchend", (e) => {
  if (!active) return;
  active = false;
  moveVec = { x: 0, y: 0 };
  knob.style.transform = `translate(0px, 0px)`;
});

function handleTouch(clientX, clientY) {
  let dx = clientX - center.x;
  let dy = clientY - center.y;
  let dist = Math.hypot(dx, dy);
  if (dist > maxRad) {
    dx = (dx / dist) * maxRad;
    dy = (dy / dist) * maxRad;
  }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  moveVec.x = dx / maxRad;
  moveVec.y = dy / maxRad;
}

updateHUD();
loop();
</script>
</body>
</html>
