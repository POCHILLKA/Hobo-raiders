<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hobo Raiders</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #030407; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; overflow: hidden; padding: 4px; color: #e2e8f0; }

    #hud { width: 100%; max-width: 360px; display: flex; justify-content: space-between; font-size: 8.5px; font-weight: bold; padding: 6px; background: #111827; border-radius: 6px; border: 1px solid #38bdf8; z-index: 10; }
    .gold { color: #facc15; }
    .hp { color: #ef4444; }
    .ammo { color: #38bdf8; }

    #game-container { position: relative; width: 100%; max-width: 360px; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid #38bdf8; background: #07090f; }
    canvas { width: 100%; height: 100%; display: block; }

    .overlay { display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 12, 0.96); flex-direction: column; align-items: center; justify-content: center; padding: 14px; text-align: center; z-index: 20; gap: 8px; }
    .overlay h2 { color: #38bdf8; font-size: 12px; margin-bottom: 2px; text-shadow: 0 0 8px #38bdf8; }

    .btn { background: #38bdf8; border: none; padding: 9px 14px; color: #08090d; font-weight: bold; border-radius: 6px; font-size: 10px; cursor: pointer; width: 100%; max-width: 190px; }
    .btn:active { transform: scale(0.97); }

    .shop-row { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #0f1624; padding: 4px 8px; border-radius: 4px; font-size: 8.5px; }
    .shop-btn { background: #0284c7; border: none; border-radius: 3px; color: #fff; font-weight: bold; padding: 3px 6px; font-size: 8px; cursor: pointer; }
    .shop-btn:disabled { background: #1e2430; color: #64748b; }

    .map-select { width: 100%; background: #111827; border: 1px solid #1f293d; border-radius: 4px; padding: 6px; font-size: 9px; color: #facc15; margin: 4px 0; }

    .summary-box { width: 100%; max-height: 120px; overflow-y: auto; background: #0b0f17; border: 1px solid #1e293b; border-radius: 4px; padding: 4px; text-align: left; font-size: 8px; margin: 4px 0; }
    .summary-item { display: flex; justify-content: space-between; border-bottom: 1px dotted #1e293b; padding: 2px 0; }

    #controls { width: 100%; max-width: 360px; height: 130px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #0b0f17; border-radius: 16px; border: 1px solid #1e293b; }
    #stick-base { width: 95px; height: 95px; background: #131b26; border-radius: 50%; border: 2px solid #38bdf8; position: relative; display: flex; align-items: center; justify-content: center; }
    #stick-knob { width: 38px; height: 38px; background: #38bdf8; border-radius: 50%; position: absolute; pointer-events: none; }
    
    .action-group { display: flex; gap: 6px; }
    .ctrl-btn { width: 55px; height: 55px; border-radius: 50%; color: white; font-weight: bold; font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid rgba(0,0,0,0.3); }
    .btn-fire { background: #ef4444; border-color: #b91c1c; }
    .btn-fire:active { background: #991b1b; }
    .btn-switch { background: #0284c7; border-color: #0369a1; }
    .btn-switch:active { background: #075985; }
  </style>
</head>
<body>

  <div id="hud">
    <span>ДЕТАЛИ: <b id="hud-stash" class="gold">0</b></span>
    <span>ОРУЖИЕ: <b id="hud-gun" class="ammo">Пистолет</b></span>
    <span>ПАТРОНЫ: <b id="hud-ammo" class="ammo">30</b></span>
    <span>HP: <b id="hud-hp" class="hp">100</b></span>
  </div>

  <div id="game-container">
    <canvas id="game" width="320" height="320"></canvas>

    <!-- БУНКЕР / МАГАЗИН -->
    <div id="bunker-overlay" class="overlay">
      <h2>БУНКЕР И СХРОН</h2>
      <div style="font-size: 8.5px; color: #94a3b8;">Баланс: <span id="menu-stash" class="gold">0</span> деталей</div>

      <div class="map-select">
        🌍 Выбранный сектор: <b id="map-name">Стелла чёртис (Завод)</b>
      </div>

      <div style="width: 100%; display: flex; flex-direction: column; gap: 3px;">
        <div class="shop-row">
          <span>Макс. HP (<span id="stat-hp">100</span>)</span>
          <button id="buy-hp" class="shop-btn" onclick="buy('hp')">+20 HP (ц: 10)</button>
        </div>
        <div class="shop-row">
          <span>Урон (<span id="stat-dmg">15</span>)</span>
          <button id="buy-dmg" class="shop-btn" onclick="buy('dmg')">+5 Урона (ц: 10)</button>
        </div>
        <div class="shop-row">
          <span>Мина в схроне (<span id="stat-mines">0</span>)</span>
          <button id="buy-mine" class="shop-btn" onclick="buy('mine')">+1 Мина (ц: 8)</button>
        </div>
      </div>

      <button class="btn" onclick="startTeleport()">В РЕЙД</button>
    </div>

    <!-- ЗАСТАВКА ТЕЛЕПОРТАЦИИ В ВЕДРЕ -->
    <div id="teleport-overlay" class="overlay" style="display:none;">
      <h2 style="color: #facc15;">ТЕЛЕПОРТАЦИЯ В МУСОРНОМ ВЕДРЕ...</h2>
      <div style="font-size: 9px; color: #94a3b8; animation: blink 0.5s infinite alternate;">Погружение на завод «Стелла чёртис»</div>
    </div>

    <!-- ИТОГИ РЕЙДА -->
    <div id="summary-overlay" class="overlay" style="display:none;">
      <h2 id="sum-title" style="color: #4ade80;">ЭВАКУАЦИЯ УСПЕШНА!</h2>
      <div style="font-size: 8.5px;">Вынесено деталей: <span id="sum-stash" class="gold">+0</span></div>
      <div class="summary-box" id="sum-list"></div>
      <button class="btn" onclick="returnToBunker()">В БУНКЕР</button>
    </div>
  </div>

  <div id="controls">
    <div id="stick-base">
      <div id="stick-knob"></div>
    </div>
    <div class="action-group">
      <div class="ctrl-btn btn-switch" onclick="switchWeapon()">СМЕНА</div>
      <div class="ctrl-btn btn-fire" onclick="playerShoot()">ОГОНЬ</div>
    </div>
  </div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let stash = parseInt(localStorage.getItem("hr_stash") || "0", 10);
let upgrades = JSON.parse(localStorage.getItem("hr_upgrades") || '{"hp":100, "dmg":15, "mines":0}');
let gameState = "bunker"; // bunker, teleport, playing, summary

let player = {
  x: 360, y: 360, w: 16, h: 16, speed: 2.2, hp: upgrades.hp, maxHp: upgrades.hp,
  dirX: 0, dirY: -1, weaponIdx: 0, ammo: 30
};

const WEAPONS = [
  { name: "Пистолет", damage: upgrades.dmg, rate: 250, ammoCost: 1, color: "#38bdf8" },
  { name: "Пулемёт", damage: upgrades.dmg * 0.7, rate: 100, ammoCost: 1, color: "#facc15" },
  { name: "Дробовик", damage: upgrades.dmg * 2.2, rate: 600, ammoCost: 2, color: "#f97316" },
  { name: "Ружьё", damage: upgrades.dmg * 1.8, rate: 450, ammoCost: 1, color: "#a855f7" },
  { name: "Ракетница", damage: upgrades.dmg * 4.0, rate: 900, ammoCost: 3, color: "#ef4444" }
];

let enemies = [];
let bullets = [];
let items = [];
let extractZone = { x: 40, y: 40, w: 60, h: 60 };
let moveVec = { x: 0, y: 0 };
let lastShotTime = 0;

let raidStats = { kills: {}, lootCollected: 0 };

function updateHUD() {
  document.getElementById("hud-stash").innerText = stash;
  document.getElementById("menu-stash").innerText = stash;
  document.getElementById("stat-hp").innerText = upgrades.hp;
  document.getElementById("stat-dmg").innerText = upgrades.dmg;
  document.getElementById("stat-mines").innerText = upgrades.mines;

  document.getElementById("hud-gun").innerText = WEAPONS[player.weaponIdx].name;
  document.getElementById("hud-ammo").innerText = player.ammo;
  document.getElementById("hud-hp").innerText = Math.ceil(player.hp);
}

function buy(type) {
  if (type === 'hp' && stash >= 10) { stash -= 10; upgrades.hp += 20; }
  if (type === 'dmg' && stash >= 10) { stash -= 10; upgrades.dmg += 5; WEAPONS[0].damage = upgrades.dmg; }
  if (type === 'mine' && stash >= 8) { stash -= 8; upgrades.mines += 1; }
  localStorage.setItem("hr_stash", stash);
  localStorage.setItem("hr_upgrades", JSON.stringify(upgrades));
  updateHUD();
}

function startTeleport() {
  document.getElementById("bunker-overlay").style.display = "none";
  document.getElementById("teleport-overlay").style.display = "flex";
  gameState = "teleport";

  setTimeout(() => {
    document.getElementById("teleport-overlay").style.display = "none";
    startRaid();
  }, 1500);
}

function startRaid() {
  gameState = "playing";
  player.x = 360; player.y = 360;
  player.hp = upgrades.hp;
  player.maxHp = upgrades.hp;
  player.ammo = 40;
  raidStats = { kills: { "Шредер": 0, "Шаробот": 0, "Огнешар": 0, "Крыса": 0 }, lootCollected: 0 };

  enemies = [];
  bullets = [];
  items = [];

  // Спавн врагов на заводе Стелла чёртис
  for (let i = 0; i < 4; i++) enemies.push({ x: 100 + i*80, y: 100, w: 18, h: 18, hp: 40, maxHp: 40, type: "Шредер", speed: 0.8, shootTimer: 0 });
  for (let i = 0; i < 4; i++) enemies.push({ x: 80 + i*70, y: 250, w: 14, h: 14, hp: 20, maxHp: 20, type: "Шаробот", speed: 1.6 });
  for (let i = 0; i < 2; i++) enemies.push({ x: 200 + i*100, y: 180, w: 16, h: 16, hp: 50, maxHp: 50, type: "Огнешар", speed: 0.9, fireTimer: 0 });
  
  // Крысы у эвакуации
  for (let i = 0; i < 3; i++) enemies.push({ x: 50 + i*20, y: 50, w: 15, h: 15, hp: 30, maxHp: 30, type: "Крыса", speed: 1.1, shootTimer: 0 });
}

function switchWeapon() {
  player.weaponIdx = (player.weaponIdx + 1) % WEAPONS.length;
  updateHUD();
}

function playerShoot() {
  if (gameState !== "playing") return;
  let now = Date.now();
  let w = WEAPONS[player.weaponIdx];
  if (now - lastShotTime < w.rate) return;
  if (player.ammo < w.ammoCost) return;

  player.ammo -= w.ammoCost;
  lastShotTime = now;
  updateHUD();

  bullets.push({
    x: player.x + 8, y: player.y + 8,
    dx: player.dirX * 5, dy: player.dirY * 5,
    damage: w.damage, color: w.color, size: 4
  });
}

function triggerEnd(success, title, color) {
  gameState = "summary";
  document.getElementById("sum-title").innerText = title;
  document.getElementById("sum-title").style.color = color;

  let totalStashEarned = success ? raidStats.lootCollected : 0;
  stash += totalStashEarned;
  localStorage.setItem("hr_stash", stash);

  document.getElementById("sum-stash").innerText = `+${totalStashEarned} деталей`;

  let list = document.getElementById("sum-list");
  list.innerHTML = `<div class="summary-item" style="font-weight:bold; color:#facc15;"><span>Уничтожено роботов:</span></div>`;
  
  for (let type in raidStats.kills) {
    if (raidStats.kills[type] > 0) {
      list.innerHTML += `<div class="summary-item"><span>${type}:</span><b>${raidStats.kills[type]} шт.</b></div>`;
    }
  }
  list.innerHTML += `<div class="summary-item" style="margin-top:4px; font-weight:bold; color:#38bdf8;"><span>Хабар:</span><b>+${raidStats.lootCollected} дет.</b></div>`;

  document.getElementById("summary-overlay").style.display = "flex";
}

function returnToBunker() {
  document.getElementById("summary-overlay").style.display = "none";
  document.getElementById("bunker-overlay").style.display = "flex";
  gameState = "bunker";
  updateHUD();
}

function update() {
  if (gameState !== "playing") return;

  if (moveVec.x !== 0 || moveVec.y !== 0) {
    player.dirX = moveVec.x;
    player.dirY = moveVec.y;
  }

  player.x = Math.max(15, Math.min(700, player.x + moveVec.x * player.speed));
  player.y = Math.max(15, Math.min(700, player.y + moveVec.y * player.speed));

  // Проверка эвакуации
  if (player.x >= extractZone.x && player.x <= extractZone.x + extractZone.w &&
      player.y >= extractZone.y && player.y <= extractZone.y + extractZone.h) {
    triggerEnd(true, "ЭВАКУАЦИЯ УСПЕШНА!", "#4ade80");
    return;
  }

  // Пули
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.dx; b.y += b.dy;
    if (b.x < 0 || b.x > 720 || b.y < 0 || b.y > 720) { bullets.splice(i, 1); continue; }

    for (let j = enemies.length - 1; j >= 0; j--) {
      let en = enemies[j];
      if (b.x > en.x && b.x < en.x + en.w && b.y > en.y && b.y < en.y + en.h) {
        en.hp -= b.damage;
        bullets.splice(i, 1);
        if (en.hp <= 0) {
          raidStats.kills[en.type]++;
          raidStats.lootCollected += 15;
          // Шанс выпадения патронов
          if (Math.random() < 0.5) player.ammo += 10;
          enemies.splice(j, 1);
        }
        break;
      }
    }
  }

  // Враги
  for (let en of enemies) {
    let dx = player.x - en.x;
    let dy = player.y - en.y;
    let dist = Math.hypot(dx, dy);

    if (en.type === "Шаробот") {
      if (dist > 1) { en.x += (dx/dist)*en.speed; en.y += (dy/dist)*en.speed; }
      if (dist < 14) { // Взрыв при соприкосновении
        player.hp -= 25;
        enemies.splice(enemies.indexOf(en), 1);
      }
    } else if (en.type === "Шредер") {
      if (dist > 50) { en.x += (dx/dist)*en.speed; en.y += (dy/dist)*en.speed; }
      en.shootTimer++;
      if (en.shootTimer > 90) { // Стрельба шрапнелью вокруг
        en.shootTimer = 0;
        for (let a = 0; a < Math.PI*2; a += Math.PI/2) {
          bullets.push({ x: en.x+8, y: en.y+8, dx: Math.cos(a)*2.5, dy: Math.sin(a)*2.5, damage: 15, color: "#f97316" });
        }
      }
    } else if (en.type === "Огнешар") {
      if (dist > 70) { en.x += (dx/dist)*en.speed; en.y += (dy/dist)*en.speed; }
      en.fireTimer++;
      if (en.fireTimer > 120) {
        en.fireTimer = 0;
        bullets.push({ x: en.x+8, y: en.y+8, dx: (dx/dist)*3, dy: (dy/dist)*3, damage: 20, color: "#ef4444" });
      }
    } else if (en.type === "Крыса") {
      if (dist > 60) { en.x += (dx/dist)*en.speed; en.y += (dy/dist)*en.speed; }
      en.shootTimer++;
      if (en.shootTimer > 70) {
        en.shootTimer = 0;
        bullets.push({ x: en.x+8, y: en.y+8, dx: (dx/dist)*3.5, dy: (dy/dist)*3.5, damage: 12, color: "#facc15" });
      }
    }

    if (dist < 14 && en.type !== "Шаробот") {
      player.hp -= 0.4;
    }
  }

  // Урон от вражеских пуль игроку
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    if (b.color !== WEAPONS[player.weaponIdx].color && Math.hypot(b.x - player.x, b.y - player.y) < 12) {
      player.hp -= b.damage;
      bullets.splice(i, 1);
    }
  }

  if (player.hp <= 0) {
    triggerEnd(false, "ПОГИБ НА ЗАВОДЕ!", "#ef4444");
  }

  updateHUD();
}

function draw() {
  ctx.fillStyle = "#121824";
  ctx.fillRect(0, 0, 320, 320);

  if (gameState !== "playing") return;

  ctx.save();
  // Камера следует за игроком
  let camX = Math.max(0, Math.min(380, player.x - 160));
  let camY = Math.max(0, Math.min(380, player.y - 160));
  ctx.translate(-camX, -camY);

  // Сетка пола завода
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 1;
  for (let x = 0; x <= 720; x += 32) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 720); ctx.stroke();
  }
  for (let y = 0; y <= 720; y += 32) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(720, y); ctx.stroke();
  }

  // Зона эвакуации (Крысы охраняют)
  ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
  ctx.fillRect(extractZone.x, extractZone.y, extractZone.w, extractZone.h);
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 2;
  ctx.strokeRect(extractZone.x, extractZone.y, extractZone.w, extractZone.h);
  ctx.fillStyle = "#38bdf8";
  ctx.font = "bold 8px monospace";
  ctx.fillText("ЭВАКУАЦИЯ", extractZone.x + 4, extractZone.y - 4);

  // Игрок
  ctx.fillStyle = "#38bdf8";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Враги
  for (let en of enemies) {
    ctx.fillStyle = en.type === "Шредер" ? "#f97316" : (en.type === "Шаробот" ? "#eab308" : (en.type === "Огнешар" ? "#ef4444" : "#a855f7"));
    ctx.fillRect(en.x, en.y, en.w, en.h);
  }

  // Пули
  for (let b of bullets) {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.size, b.size);
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Джойстик
const base = document.getElementById("stick-base");
const knob = document.getElementById("stick-knob");
let active = false;
let center = { x: 0, y: 0 };
const maxRad = 32;

base.addEventListener("touchstart", (e) => {
  e.preventDefault();
  active = true;
  let r = base.getBoundingClientRect();
  center = { x: r.left + r.width/2, y: r.top + r.height/2 };
  handleTouch(e.touches[0].clientX, e.touches[0].clientY);
});

window.addEventListener("touchmove", (e) => {
  if (!active) return;
  e.preventDefault();
  handleTouch(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

window.addEventListener("touchend", (e) => {
  if (!active) return;
  active = false;
  moveVec = { x: 0, y: 0 };
  knob.style.transform = `translate(0px, 0px)`;
});

function handleTouch(clientX, clientY) {
  let dx = clientX - center.x;
  let dy = clientY - center.y;
  let dist = Math.hypot(dx, dy);
  if (dist > maxRad) {
    dx = (dx / dist) * maxRad;
    dy = (dy / dist) * maxRad;
  }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  moveVec.x = dx / maxRad;
  moveVec.y = dy / maxRad;
}

updateHUD();
loop();
</script>
</body>
</html>
